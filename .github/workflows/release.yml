name: Publish game

# This dispatch is the single release approval. Merges never publish.
on:
  workflow_dispatch:
    inputs:
      minify:
        description: Minify the published HTML, CSS, and JavaScript
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      downloads_artifact: release-downloads-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Use Ubuntu main package mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|https\?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            cat /etc/apt/apt-mirrors.txt
          fi
      - run: npx playwright install --with-deps chromium firefox
      # Firefox needs an audio server as well as the installed client libraries.
      # A null sink provides a real playback clock without physical hardware.
      - name: Start virtual audio output
        run: |
          sudo apt-get install --yes --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=neon_ci
          pactl set-default-sink neon_ci
          pactl info
          pactl list short sinks
      - run: npm run check:syntax && npm run lint && npm run test:unit
      - name: Build both packages and reject existing tags
        run: node tools/ci/release-packages.cjs ${{ inputs.minify && '--minify' || '--no-minify' }}
        env:
          GH_TOKEN: ${{ github.token }}
      # Exercise both exact public file sets, with fresh browser storage.
      - run: npm run test:browser
        env:
          SERVE_DIR: release-assets/sites/minified
      - run: npm run test:browser
        env:
          SERVE_DIR: release-assets/sites/unminified
      - run: node tools/ci/release-packages.cjs --verify-pages
      - name: Retain failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, MIT
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
          archive: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, MIT
        with:
          name: release-downloads-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-assets/*.zip
            release-assets/manifest.json
          if-no-files-found: error
          compression-level: 0
          archive: true
      # The composite Pages uploader contains a tag-pinned nested action, which
      # the repository's full-SHA policy rejects. Preserve its tar format here.
      - name: Archive verified Pages site
        run: tar --dereference --hard-dereference --directory dist -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, MIT
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          compression-level: 0
          archive: true
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested game
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  release:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, MIT
        with:
          name: ${{ needs.prepare.outputs.downloads_artifact }}
          path: release-assets
          digest-mismatch: error
      - name: Publish verified downloads
        run: node tools/ci/publish-release.cjs
        env:
          GH_TOKEN: ${{ github.token }}
